name: Run Two Scraper Agents

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: run-two-scraper-agents
  cancel-in-progress: false

jobs:
  top-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      TZ: Asia/Karachi
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create creds.json safely from secret
        shell: bash
        run: |
          cat > creds.json <<'EOF'
          ${{ secrets.CREDS_JSON }}
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          python -m playwright --version

      - name: Run top agent
        run: |
          python agent_runner.py top

  bottom-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      TZ: Asia/Karachi
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create creds.json safely from secret
        shell: bash
        run: |
          cat > creds.json <<'EOF'
          ${{ secrets.CREDS_JSON }}
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          python -m playwright --version

      - name: Run bottom agent
        run: |
          python agent_runner.py bottom

  check-and-retrigger:
    runs-on: ubuntu-latest
    needs: [top-agent, bottom-agent]
    if: always()

    env:
      TZ: Asia/Karachi
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create creds.json safely from secret
        shell: bash
        run: |
          cat > creds.json <<'EOF'
          ${{ secrets.CREDS_JSON }}
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check remaining rows
        run: |
          python check_remaining.py
